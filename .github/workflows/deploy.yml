name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  # The site is a static export, so Goodreads shelves are baked in at build
  # time. Rebuild daily to pick up reading changes. 02:00 UTC = 07:30 IST.
  schedule:
    - cron: "0 2 * * *"

  # Manual trigger, for when you change a shelf and don't want to wait a day.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
